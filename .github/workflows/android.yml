name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Optional: add these repository secrets to sign Overdrive.apk with your
      # own key (see README). Without them the debug key is used.
      OVERDRIVE_STORE_PASSWORD: ${{ secrets.OVERDRIVE_STORE_PASSWORD }}
      OVERDRIVE_KEY_ALIAS: ${{ secrets.OVERDRIVE_KEY_ALIAS }}
      OVERDRIVE_KEY_PASSWORD: ${{ secrets.OVERDRIVE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null \
            || { echo "Available platforms:"; "$SDKM" --list | grep -E 'platforms;android-3[5-9]'; exit 1; }

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.OVERDRIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OVERDRIVE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found: signing with it."
          else
            echo "No OVERDRIVE_KEYSTORE_BASE64 secret: release APK is signed with the debug key."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Print lint findings
        if: always()
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          [ -f "$f" ] && grep -E "(Warning|Error):" "$f" || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (R8 minified)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Overdrive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: Overdrive-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Commit Overdrive.apk to the repository
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/release/*.apk Overdrive.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Overdrive.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
            exit 0
          fi
          git commit -m "Build Overdrive.apk from ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

  # Runs the end-to-end SmokeTest on a real Android emulator and refreshes the
  # screenshots in docs/screenshots.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run end-to-end test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter || true
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 2112 || true
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false || true
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false || true
            ./gradlew :app:connectedDebugAndroidTest || touch ui-test-failed
            mkdir -p docs/screenshots
            adb pull /sdcard/Pictures/OverdriveScreens/. docs/screenshots/ || true
            adb logcat -d -b crash > crash-log.txt || true

      - name: Show crash log
        if: always()
        run: |
          [ -s crash-log.txt ] && cat crash-log.txt || echo "No crashes logged."
          ls -la docs/screenshots || true

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-results
          path: |
            docs/screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Commit screenshots
        if: always() && github.event_name == 'push'
        run: |
          [ -d docs/screenshots ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update screenshots from ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail if the end-to-end test failed
        run: |
          if [ -f ui-test-failed ]; then
            f=$(find app/build/outputs/androidTest-results -name "*.xml" | head -1)
            [ -n "$f" ] && sed -n '1,200p' "$f"
            exit 1
          fi
